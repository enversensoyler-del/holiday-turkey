<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Holiday in Turkey: Istanbul, Fethiye, Cappadocia and Southeast Türkiye tours with private transport, meals and hotel included.">
<meta name="theme-color" content="#1597d6">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<title>Holiday in Turkey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Manrope:wght@400;500;600;700&family=El+Messiri:wght@600;700&family=Cairo:wght@400;600&display=swap">
<style>
/* Layout: İznik çini mavisi bir başlık bandı, ardından tek sütun akan bölümler; turlar şehir kartları gridinde, iletişim iki kolon. */
:root{
  --bg:#e8f6ff; --bg2:#fffbf3; --surface:#ffffff; --ink:#123a57; --muted:#56748a;
  --cobalt:#1597d6; --turq:#0b9fd8; --coral:#ff8a3d; --gold:#ffd166; --line:#d3ecfa;
  --head:rgba(255,255,255,.88); --head-fg:#0e5c8f;
  --hero-fg:#ffffff;
  --f-display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ar:"Cairo", "Segoe UI", Tahoma, sans-serif;
  --f-ar-display:"El Messiri", "Cairo", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1c22; --bg2:#1a1a24; --surface:#112a31; --ink:#e7f3f2; --muted:#9dbcbd;
  --cobalt:#0d5566; --turq:#3fd0c6; --coral:#ff8f57; --gold:#ffc766; --line:#1f3d45; --head:rgba(10,28,34,.88); --head-fg:#e7f3f2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1c22; --bg2:#1a1a24; --surface:#112a31; --ink:#e7f3f2; --muted:#9dbcbd;
  --cobalt:#0d5566; --turq:#3fd0c6; --coral:#ff8f57; --gold:#ffc766; --line:#1f3d45; --head:rgba(10,28,34,.88); --head-fg:#e7f3f2; color-scheme:dark}

*{box-sizing:border-box}
body{background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed,var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
html[dir="rtl"] body{font-family:var(--f-ar)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.08;letter-spacing:-.01em}
h1 em,h2 em{font-style:italic}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3,html[dir="rtl"] .brand{font-family:var(--f-ar-display);font-weight:700;font-style:normal;letter-spacing:0;line-height:1.3}
a{color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--head);backdrop-filter:blur(10px);color:var(--head-fg);box-shadow:0 2px 14px rgba(21,151,214,.12)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-style:italic;font-size:1.55rem;text-decoration:none}
.brand .mark{flex:none;width:48px;height:48px;border-radius:50%;overflow:hidden;background:#fff;display:grid;place-items:center;padding:3px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.brand .mark img{max-width:86%;max-height:86%;display:block}
.foot-logo{width:140px;height:140px;max-width:100%;border-radius:50%;background:#fff;padding:14px;object-fit:contain;display:block;box-shadow:0 4px 16px rgba(21,151,214,.2)}
.wa-float{position:fixed;z-index:20;bottom:calc(18px + env(safe-area-inset-bottom,0px));right:calc(18px + env(safe-area-inset-right,0px));width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:#25d366;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .2s}
.wa-float:hover{background:#1ebe5a;transform:scale(1.06)}
.wa-float svg{width:32px;height:32px}
.wa-icon{width:50px;height:50px;padding:0;justify-content:center;border-radius:50%}
.wa-icon svg{width:36px;height:36px}
.btn.wa{background:#25d366;color:#fff}
.btn.wa:hover{background:#1ebe5a}
nav.menu{display:flex;gap:18px;font-size:.92rem}
nav.menu a{text-decoration:none;opacity:.9}
nav.menu a:hover{opacity:1;text-decoration:underline}
.langs{display:flex;gap:4px}
.langs button{font:inherit;font-size:.8rem;letter-spacing:.06em;background:transparent;color:var(--head-fg);border:1px solid color-mix(in srgb,var(--head-fg) 35%,transparent);border-radius:4px;padding:4px 9px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--cobalt);color:#fff;border-color:var(--cobalt)}
@media (max-width:760px){nav.menu{display:none}}

/* hero */
.hero{background-color:var(--cobalt);color:var(--hero-fg);position:relative;overflow:hidden;isolation:isolate}
.hero .slides{position:absolute;inset:0;z-index:-2}
.hero .slides i{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;animation:fade 28s infinite}
.hero .slides i:nth-child(1){background-image:url("img/bg-istanbul.jpg");opacity:1}
.hero .slides i:nth-child(2){background-image:url("img/bg-kapadokya.jpg");animation-delay:7s}
.hero .slides i:nth-child(3){background-image:url("img/bg-oludeniz.jpg");animation-delay:14s}
.hero .slides i:nth-child(4){background-image:url("img/bg-gaziantep.jpg");animation-delay:21s;background-position:center 35%}
.hero .slides i:nth-child(1){animation-name:fade1}
@keyframes fade{0%{opacity:0;transform:scale(1.08)}5%{opacity:1}25%{opacity:1}31%{opacity:0;transform:scale(1)}100%{opacity:0}}
@keyframes fade1{0%{opacity:1;transform:scale(1.08)}25%{opacity:1}31%{opacity:0;transform:scale(1)}95%{opacity:0}100%{opacity:1}}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,rgba(0,80,140,.5) 0%,rgba(0,120,190,.22) 55%,rgba(0,140,210,0) 100%)}
.hero .dots{position:absolute;bottom:18px;inset-inline-end:max(16px,env(safe-area-inset-right,0px));display:flex;gap:6px}
.hero .dots span{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:rgba(0,0,0,.3);color:#fff;opacity:.85}
@media (prefers-reduced-motion:reduce){.hero .slides i{animation:none}.hero .slides i:not(:first-child){opacity:0}}
.hero .wrap{padding-block:120px 110px;display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:end}
.hero h1{font-size:clamp(2.6rem,6.2vw,4.6rem);max-width:15ch;font-style:italic;text-shadow:0 2px 18px rgba(0,0,0,.25)}
.hero p.lead{text-shadow:0 1px 10px rgba(0,0,0,.35);font-size:1.12rem;max-width:46ch;opacity:.92;margin:18px 0 26px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:500;border-radius:6px;padding:12px 20px;text-decoration:none;cursor:pointer;border:2px solid transparent}
.btn.primary{background:var(--coral);color:#fff}
.btn.ghost{border-color:rgba(255,255,255,.6);color:#fff;background:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.facts{list-style:none;margin:0;padding:22px;border-radius:10px;background:rgba(0,110,175,.32);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.15);display:grid;gap:14px;font-size:.95rem}
.facts li{display:flex;gap:12px;align-items:baseline}
.facts b{font-family:var(--f-display);font-weight:700;font-size:2rem;min-width:3.2ch;color:var(--gold);font-variant-numeric:tabular-nums}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr;padding-block:48px}}

/* sections */
section{padding-block:72px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--turq);font-weight:600;margin:0 0 10px}
html[dir="rtl"] .eyebrow{letter-spacing:0}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:32px}
.sec-head h2{font-size:clamp(2rem,4vw,3rem)}
.sec-head p{max-width:48ch;color:var(--muted);margin:0}

/* tours */
.tours{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.tour{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 30px -18px rgba(21,151,214,.45);transition:transform .25s,box-shadow .25s}
.tour:hover{transform:translateY(-4px);box-shadow:0 18px 40px -20px rgba(21,151,214,.6)}
.tour .art{aspect-ratio:16/9;max-width:100%;position:relative;display:flex;align-items:flex-end;padding:14px;color:#fff}
.tour .art span{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;background:rgba(0,0,0,.28);padding:3px 8px;border-radius:3px}
.tour .art{background-color:var(--line);background-size:cover;background-position:center;aspect-ratio:4/3}
.a1{background-image:url("img/istanbul.jpg")}
.a2{background-image:url("img/fethiye.jpg")}
.a3{background-image:url("img/kapadokya.jpg")}
.a4{background-image:url("img/gap.jpg");background-position:center 70%}
.tour .art span{backdrop-filter:blur(2px)}
.tour .body{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.tour h3{font-size:1.6rem}
.tour p{margin:0;color:var(--muted);font-size:.95rem}
.tour .meta{margin-top:auto;padding-top:12px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.tour .meta strong{color:var(--ink);font-weight:500}

.inc-h{margin:4px 0 0!important;font-size:.75rem!important;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--turq)!important}
html[dir="rtl"] .inc-h{letter-spacing:0}
.inc{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.inc li{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;font-weight:500;padding:4px 10px 4px 8px;border-radius:20px;background:color-mix(in srgb,var(--turq) 13%,transparent);color:var(--ink)}
.inc li::before{content:"✓";color:var(--turq);font-weight:700}

/* packages band */
.band{background:color-mix(in srgb,var(--surface) 75%,transparent);border-block:1px solid var(--line)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.svc{display:grid;gap:22px}
.svc div{display:grid;grid-template-columns:40px 1fr;gap:14px}
.svc .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--turq) 15%,transparent);color:var(--turq)}
.svc h3{font-size:1.15rem;margin-bottom:4px}
.svc p{margin:0;color:var(--muted);font-size:.95rem}
@media (max-width:820px){.split{grid-template-columns:1fr;gap:36px}}

/* health */
.health{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.hcard{padding:22px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.hcard h3{font-size:1.2rem;margin-bottom:8px}
.hcard p{margin:0;color:var(--muted);font-size:.95rem}
.hcard ul{margin:12px 0 0;padding-inline-start:18px;font-size:.92rem}
.note{margin-top:20px;font-size:.85rem;color:var(--muted);max-width:75ch}
@media (max-width:820px){.health{grid-template-columns:1fr}}

/* steps */
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;counter-reset:s}
.steps li{counter-increment:s;padding-top:16px;border-top:3px solid var(--turq)}
.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:700;font-style:italic;font-size:2.4rem;color:var(--coral);display:block;line-height:1}
.steps h3{font-size:1.1rem;margin:8px 0 4px}
.steps p{margin:0;color:var(--muted);font-size:.93rem}
@media (max-width:820px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.steps{grid-template-columns:1fr}}

/* contact */
.contact{color:#fff;background:linear-gradient(120deg,rgba(10,130,200,.85),rgba(70,190,235,.62)),url("img/bg-oludeniz.jpg") center/cover}
.contact .split{align-items:start}
.contact .eyebrow{color:var(--gold)}
.contact p{opacity:.9}
.channels{display:grid;gap:10px;margin-top:20px}
.channels div{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:6px;background:rgba(255,255,255,.08)}
.channels span{opacity:.75;font-size:.9rem}
.channels b{font-weight:500;user-select:all;direction:ltr;unicode-bidi:embed}
form{background:var(--surface);color:var(--ink);border-radius:8px;padding:24px;display:grid;gap:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:grid;gap:6px;font-size:.88rem;font-weight:500;min-width:0}
input,select,textarea{font:inherit;font-weight:400;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical}
.ok{padding:12px;border-radius:6px;background:color-mix(in srgb,var(--turq) 15%,transparent);color:var(--ink);font-size:.92rem}
@media (max-width:520px){.row{grid-template-columns:1fr}}

footer{padding-block:28px;font-size:.85rem;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
html{scroll-behavior:smooth}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="Holiday in Turkey">
      <span class="mark"><img src="img/logo-icon.jpg" alt=""></span>
      Holiday in Turkey
    </a>
    <nav class="menu">
      <a href="#tours" data-i="nav_tours"></a>
      <a href="#packages" data-i="nav_pack"></a>
            <a href="#contact" data-i="nav_contact"></a>
    </nav>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-l="en">EN</button>
      <button type="button" data-l="ar">AR</button>
      <button type="button" data-l="ru">RU</button>
      <button type="button" data-l="tr">TR</button>
    </div>
  </div>
</header>

<main id="top">
<section class="hero">
  <div class="slides" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="wrap">
    <div>
      <p class="eyebrow" style="color:var(--gold)" data-i="hero_eb"></p>
      <h1 data-i="hero_h"></h1>
      <p class="lead" data-i="hero_p"></p>
      <div class="cta">
        <a class="btn primary" href="#contact" data-i="hero_b1"></a>
        <a class="btn ghost" href="#tours" data-i="hero_b2"></a>
      </div>
    </div>
    <ul class="facts">
      <li><b>24/7</b><span data-i="f2"></span></li>
      <li><b>1</b><span data-i="f3"></span></li>
    </ul>
  </div>
</section>

<section id="tours">
  <div class="wrap">
    <div class="sec-head">
      <div><p class="eyebrow" data-i="t_eb"></p><h2 data-i="t_h"></h2></div>
      <p data-i="t_p"></p>
    </div>
    <div class="tours">
      <article class="tour"><div class="art a1"><span data-i="c1_tag"></span></div><div class="body"><h3 data-i="c1_h"></h3><p data-i="c1_p"></p><p class="inc-h" data-i="inc_h"></p><ul class="inc"><li data-i="inc1"></li><li data-i="inc2"></li><li data-i="inc3"></li></ul><div class="meta"><span data-i="c1_d"></span><strong data-i="ask"></strong></div></div></article>
      <article class="tour"><div class="art a2"><span data-i="c2_tag"></span></div><div class="body"><h3 data-i="c2_h"></h3><p data-i="c2_p"></p><p class="inc-h" data-i="inc_h"></p><ul class="inc"><li data-i="inc1"></li><li data-i="inc2"></li><li data-i="inc3"></li></ul><div class="meta"><span data-i="c2_d"></span><strong data-i="ask"></strong></div></div></article>
      <article class="tour"><div class="art a3"><span data-i="c3_tag"></span></div><div class="body"><h3 data-i="c3_h"></h3><p data-i="c3_p"></p><p class="inc-h" data-i="inc_h"></p><ul class="inc"><li data-i="inc1"></li><li data-i="inc2"></li><li data-i="inc3"></li></ul><div class="meta"><span data-i="c3_d"></span><strong data-i="ask"></strong></div></div></article>
      <article class="tour"><div class="art a4"><span data-i="c4_tag"></span></div><div class="body"><h3 data-i="c4_h"></h3><p data-i="c4_p"></p><p class="inc-h" data-i="inc_h"></p><ul class="inc"><li data-i="inc1"></li><li data-i="inc2"></li><li data-i="inc3"></li></ul><div class="meta"><span data-i="c4_d"></span><strong data-i="ask"></strong></div></div></article>
    </div>
  </div>
</section>

<section id="packages" class="band">
  <div class="wrap split">
    <div>
      <p class="eyebrow" data-i="p_eb"></p>
      <h2 style="font-size:clamp(2rem,4vw,3rem)" data-i="p_h"></h2>
      <p style="color:var(--muted);max-width:44ch" data-i="p_p"></p>
    </div>
    <div class="svc">
      <div><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V8l7-4 7 4v13M9 21v-6h6v6"/></svg></span><div><h3 data-i="s1_h"></h3><p data-i="s1_p"></p></div></div>
      <div><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 17h14l-1.5-6h-11zM7 17v2M17 17v2M6.5 11 8 6h8l1.5 5"/></svg></span><div><h3 data-i="s2_h"></h3><p data-i="s2_p"></p></div></div>
      <div><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0-6 6c0 5 6 12 6 12s6-7 6-12a6 6 0 0 0-6-6z"/><circle cx="12" cy="9" r="2"/></svg></span><div><h3 data-i="s3_h"></h3><p data-i="s3_p"></p></div></div>
      <div><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H8l-4 4z"/></svg></span><div><h3 data-i="s4_h"></h3><p data-i="s4_p"></p></div></div>
    </div>
  </div>
</section>

<section class="band" id="how">
  <div class="wrap">
    <div class="sec-head"><div><p class="eyebrow" data-i="w_eb"></p><h2 data-i="w_h"></h2></div></div>
    <ol class="steps">
      <li><h3 data-i="w1_h"></h3><p data-i="w1_p"></p></li>
      <li><h3 data-i="w2_h"></h3><p data-i="w2_p"></p></li>
      <li><h3 data-i="w3_h"></h3><p data-i="w3_p"></p></li>
      <li><h3 data-i="w4_h"></h3><p data-i="w4_p"></p></li>
    </ol>
  </div>
</section>

<section class="contact" id="contact">
  <div class="wrap split">
    <div>
      <p class="eyebrow" data-i="k_eb"></p>
      <h2 style="font-size:clamp(2rem,4vw,3rem)" data-i="k_h"></h2>
      <p data-i="k_p"></p>
      <div class="channels">
        <div><span>WhatsApp</span><b><a class="wa-link wa-num" href="#" target="_blank" rel="noopener">+90 551 576 00 27</a></b></div>
        <div><span>Instagram</span><b><a href="https://www.instagram.com/holiday_turkey_ig/" target="_blank" rel="noopener">@holiday_turkey_ig</a></b></div>
      </div>
    </div>
    <form id="req" novalidate>
      <div class="row">
        <label for="f_name"><span data-i="fm_name"></span><input id="f_name" required autocomplete="name"></label>
        <label for="f_country"><span data-i="fm_country"></span><input id="f_country" autocomplete="country-name"></label>
      </div>
      <div class="row">
        <label for="f_phone"><span data-i="fm_phone"></span><input id="f_phone" type="tel" required autocomplete="tel" dir="ltr"></label>
        <label for="f_people"><span data-i="fm_people"></span><input id="f_people" type="number" min="1" value="2"></label>
      </div>
      <div class="row">
        <label for="f_type"><span data-i="fm_type"></span>
          <select id="f_type"><option data-i="o1"></option><option data-i="o2"></option></select></label>
        <label for="f_date"><span data-i="fm_date"></span><input id="f_date" type="month"></label>

/* WhatsApp numarası: ülke kodu ile, boşluksuz ve + olmadan (örnek: 905321234567) */
const WA_NUMBER="905515760027";
const waUrl=t=>"https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(t);
let cur="en";
function setLang(l){
  cur=T[l]?l:"en";
  const d=T[cur];
  document.documentElement.lang=cur;
  document.documentElement.dir=cur==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(el=>{const k=el.dataset.i; if(d[k]!=null) el.textContent=d[k];});
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===cur?"true":"false"));
  document.querySelectorAll(".wa-link,#waFloat").forEach(a=>a.href=waUrl(d.wa_hello));
  try{localStorage.setItem("ht_lang",cur)}catch(e){}
}
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));
let saved=null; try{saved=localStorage.getItem("ht_lang")}catch(e){}
setLang(saved||"en");
document.getElementById("req").addEventListener("submit",e=>{
  e.preventDefault();
  const ok=document.getElementById("ok");
  const send=document.getElementById("waSend");
  const v=id=>document.getElementById(id).value.trim();
  const valid=v("f_name")&&v("f_phone");
  ok.textContent=valid?T[cur].fm_ok:T[cur].fm_err;
  ok.hidden=false;
  if(!valid){send.hidden=true;return;}
  const d=T[cur];
  const sel=document.getElementById("f_type");
  const lines=[d.wa_hello,"",
    d.fm_name+": "+v("f_name"),
    d.fm_country+": "+v("f_country"),
    d.fm_phone+": "+v("f_phone"),
    d.fm_people+": "+v("f_people"),
    d.fm_type+": "+sel.options[sel.selectedIndex].text,
    d.fm_date+": "+v("f_date"),
    d.fm_msg+": "+v("f_msg")].filter(x=>!/: $/.test(x));
  send.href=waUrl(lines.join("\n"));
  send.hidden=false;
  try{window.open(send.href,"_blank","noopener")}catch(err){}
});
</script>
